<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kayıt Ol | Çalışma Portalı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <header class="auth-header">
      <h2>Hesap Oluştur</h2>
      <p>Aramıza katılmak için formu doldurun.</p>
    </header>

    <form class="auth-form" action="login.html" method="get">
      <div class="form-group">
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" name="name" placeholder="Adınız Soyadınız" required>
      </div>

      <div class="form-group">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="password-confirm">Şifre Tekrarı</label>
        <input type="password" id="password-confirm" name="passwordConfirm" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">Kayıt Ol</button>
    </form>

    <footer class="auth-footer">
      <p>Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
    </footer>
  </main>

</body>
</html>
