<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Giriş Yap | Çalışma Portalı</title>
  <!-- CSS dosyamızı buraya bağlıyoruz -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <header class="auth-header">
      <h2>Hoş Geldiniz</h2>
      <p>Öğrenci paneline erişmek için giriş yapın.</p>
    </header>

    <form class="auth-form" action="lessons.html" method="get">
      <div class="form-group">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">Giriş Yap</button>
    </form>

    <footer class="auth-footer">
      <p>Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
    </footer>
  </main>

</body>
</html>
