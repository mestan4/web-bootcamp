<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Çalışma Ekle | Çalışma Portalı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ortak Navbar -->
  <header class="navbar">
    <div class="logo">ÇalışmaPortalı</div>
    <nav class="nav-links">
      <a href="lessons.html">Dersler</a>
      <a href="add-study.html" class="active">Çalışma Ekle</a>
      <a href="reports.html">Raporlar</a>
      <a href="login.html" class="logout-link">Çıkış</a>
    </nav>
  </header>

  <!-- Form İçerik Alanı -->
  <main class="container">
    <div class="form-card">
      <div class="page-title">
        <h1>Yeni Çalışma Kaydı</h1>
        <p>Günün çalışma detaylarını ve sürelerini sisteme ekleyin.</p>
      </div>

      <form action="reports.html" method="get">
        
        <!-- 1. Satır: Ders Adı ve Tarih -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="lesson-input">Ders / Modül</label>
            <input list="lesson-options" id="lesson-input" name="lesson" placeholder="Ders seçin veya yazın..." required>
            <datalist id="lesson-options">
              <option value="1. Gün: HTML Temelleri">
              <option value="2. Gün: CSS & Grid / Flexbox">
              <option value="3. Gün: JavaScript Giriş">
              <option value="4. Gün: Modern JavaScript & API">
              <option value="5. Gün: React JS">
            </datalist>
          </div>

          <div class="form-group flex-1">
            <label for="study-date">Çalışma Tarihi</label>
            <input type="date" id="study-date" name="studyDate" required>
          </div>
        </div>

        <!-- 2. Satır: Süre, Alt Konu ve Durum -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="duration">Çalışma Süresi (Dakika)</label>
            <input type="number" id="duration" name="duration" min="0" step="1" placeholder="Örn: 45" required>
          </div>

          <div class="form-group flex-1">
            <label for="study-topic">İşlenen Alt Konu</label>
            <input type="text" id="study-topic" name="topic" placeholder="Örn: CSS Grid yapısı" required>
          </div>

          <div class="form-group flex-1">
            <label for="status-select">Çalışma Durumu</label>
            <select id="status-select" name="status">
              <option value="Tamamlandı">Tamamlandı</option>
              <option value="Devam Ediyor">Devam Ediyor</option>
              <option value="Planlandı">Planlandı</option>
            </select>
          </div>
        </div>

        <!-- 3. Satır: Notlar -->
        <div class="form-group">
          <label for="notes">Çalışma Notları & Karşılaşılan Hatalar</label>
          <textarea id="notes" name="notes" rows="3" placeholder="Bu derste neleri öğrendiniz, nerelerde zorlandınız?"></textarea>
        </div>

        <!-- Butonlar -->
        <div class="form-actions">
          <a href="lessons.html" class="btn-secondary">İptal</a>
          <button type="submit" class="btn-primary-inline">Kaydı Tamamla</button>
        </div>

      </form>

      </form>
    </div>
  </main>

  <!-- Sayfanın en altına JS dosyamızı bağlıyoruz -->
  <script src="script.js"></script>
</body>
</html>

</body>
</html>
